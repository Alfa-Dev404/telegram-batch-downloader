name: Feature request
description: Suggest something the downloader should do.
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What are you trying to do?
          description: The situation, not the solution. For example "I only want files from the last month".
      validations:
          required: true
    - type: textarea
      id: idea
      attributes:
          label: How could it work?
          description: Optional. A rough idea is fine.
    - type: textarea
      id: alternatives
      attributes:
          label: What do you do today instead?
